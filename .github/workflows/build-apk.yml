name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate index.html
        run: |
          echo "Files in repo:"
          find . -type f -not -path './.git/*' | head -50
          SRC=$(find . -type f -iname 'index*' -not -path './.git/*' -not -path './.github/*' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::No index.html found anywhere in the repo. Check the file list above."
            exit 1
          fi
          echo "Using: $SRC"
          mkdir -p www
          cp "$SRC" www/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project around index.html
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Night Shift" com.nightshift.game --web-dir www
          npx cap add android
          npx cap sync android

      - name: Portrait lock and vibration permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' "$MANIFEST"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: night-shift-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
